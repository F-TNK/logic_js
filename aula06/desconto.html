<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desconto | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main>
      <article class="calcDesconto">
        <h1>Cauculo de Desconto</h1>

        <label for="preco">Preço</label>
        <input type="number" id="preco" step="0.01" />

        <label for="prcnt">Porcentagem de Desconto</label>
        <input type="number" id="prcnt" step="1" />

        <button id="calc">Calcular</button>
        <p id="pFinal" class="pFinal">Preço Final</p>
      </article>
    </main>
    <script src="js/desconto.js"></script>
  </body>
</html>
